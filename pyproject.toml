[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "x-bot"
version = "0.1.0"
description = "X (x.com) への自動投稿ボット。外部 cron が起動する GitHub Actions が投稿キューを消化する。"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
x-bot = "x_bot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
