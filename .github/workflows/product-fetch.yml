name: 紹介する商品を足す

# neta/設定.json の「商品の探しかた」にあるキーワードで楽天市場を検索し、
# アフィリエイトリンク付きの商品を neta/ネタ帳.md の
# 「## 紹介する商品」の末尾に追記してコミットする。
#
# 投稿文は書かない。書くのは compose.py の仕事。
# ここで入る商品のメモには [未使用] が付くので、
# compose.py は「使った感想」を書かせない。
#
# 毎週月曜 8:00 (JST) = 日曜 23:00 (UTC)。在庫が切れる前に補充する用。
# 手で回したいときは Actions タブ → このワークフロー → Run workflow。
on:
  repository_dispatch:
    types: [product-fetch]
  schedule:
    - cron: "0 23 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "ファイルに書かず、見つかった商品を表示するだけ"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: product-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 楽天で探して ネタ帳.md に追記する
        id: fetch
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          # アプリを「Webアプリケーション」で登録したときだけ要る（未登録なら空で動く）
          RAKUTEN_REFERER: ${{ secrets.RAKUTEN_REFERER }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: |
          set -o pipefail
          node "scripts/商品を取る.mjs" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: コミットする
        if: ${{ steps.fetch.outputs.added != '0' && !inputs.dry_run }}
        run: |
          set -euo pipefail
          TARGET="neta/ネタ帳.md"
          if git diff --quiet -- "${TARGET}"; then
            echo "${TARGET} に変更なし。コミットはしません。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${TARGET}"
          git commit -m "chore(neta): 紹介する商品を補充（$(TZ=Asia/Tokyo date +%F)）"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push; then
              exit 0
            fi
            wait=$((2 ** attempt))
            echo "push に失敗。${wait} 秒待って再試行します。"
            sleep "${wait}"
          done
          exit 1
