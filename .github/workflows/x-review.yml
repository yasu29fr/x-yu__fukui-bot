name: X 日次レビュー

# マーケティング部・検証改善チーム。
# 昨日までの投稿の数字を取り、何が効いたかを判定して、翌日の生成指示（insights/learnings.md）を 1 つだけ更新する。
# 毎日 19:15 JST ごろ（20:00 の compose より前）に動かす。
# 外部 cron（cron-job.org）から x-review で叩くのを本線にし、GitHub の schedule は保険。
on:
  repository_dispatch:
    types: [x-review]
  schedule:
    - cron: "15 10 * * *"   # 19:15 JST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true なら結果を表示するだけでファイルを書かない"
        required: false
        default: "false"

concurrency:
  group: x-post
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PLATFORM: x
      DRY_RUN: ${{ github.event.inputs.dry_run }}
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
      REVIEW_HOLD_DAYS: ${{ vars.REVIEW_HOLD_DAYS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 数字を取り、判定し、指示を更新する
        run: python scripts/review.py

      - name: 検証結果をコミットする
        if: env.DRY_RUN != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add insights
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -m "chore(review): 日次レビュー $(TZ=Asia/Tokyo date +%Y-%m-%d)"
          for i in 1 2 3 4; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push; then exit 0; fi
            sleep $((2 ** i))
          done
          exit 1
