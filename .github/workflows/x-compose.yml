name: X 翌日ぶんを作成

# 運用ボードとネタ帳を材料に、翌日ぶんの投稿 3 本を作ってキューに追加する。
# 外部 cron から毎日きまった時刻（例: 22:00 JST）に x-compose で起動する想定。

on:
  repository_dispatch:
    types: [x-compose]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true なら生成結果を表示するだけでキューに書き込まない"
        required: false
        default: "false"

concurrency:
  group: x-post
  cancel-in-progress: false

jobs:
  compose:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PYTHONPATH: src
      DRY_RUN: ${{ github.event.inputs.dry_run }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # ドキュメント ID は秘密ではないので Variables に置く
      BOARD_DOC_ID: ${{ vars.BOARD_DOC_ID }}
      NETA_DOC_ID: ${{ vars.NETA_DOC_ID }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 翌日ぶんの 3 本を作る
        run: python scripts/compose.py

      - name: キューの形式を検証する
        run: python -m x_bot validate

      - name: コミットする
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          if git diff --quiet -- posts/queue.jsonl; then
            echo "キューに変更はありません。"
            exit 0
          fi
          git config user.name "X Compose"
          git config user.email "actions@github.com"
          git add posts/queue.jsonl
          git commit -m "chore(queue): 翌日ぶんを追加"
          git push
