name: X 認証の確認

# 投稿はせず、鍵 4 つが正しく組み合わさっているかだけを見る。
# GET /2/users/me を叩いて、返ってきたアカウント名を表示する。
# Secrets を入れ替えたあと、投稿を試す前にここで確かめる。

on:
  repository_dispatch:
    types: [x-auth-check]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 認証だけ確認する（投稿はしない）
        env:
          PYTHONPATH: src
          EXPECTED_USERNAME: yu__fukui
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          python -m x_bot me > me.json
          python - <<'PY'
          import json, os
          user = json.load(open("me.json"))["data"]
          handle = user.get("username", "")
          metrics = user.get("public_metrics") or {}
          print(
              f"::notice::認証できました: @{handle}（{user.get('name','')}）"
              f" フォロワー={metrics.get('followers_count', '不明')}"
              f" verified_type={user.get('verified_type', '不明')}"
              f" subscription_type={user.get('subscription_type', '不明')}"
          )
          expected = os.environ.get("EXPECTED_USERNAME", "")
          if expected and handle.lower() != expected.lower():
              raise SystemExit(f"::error::想定と違うアカウントです。期待 @{expected} / 実際 @{handle}")
          PY
