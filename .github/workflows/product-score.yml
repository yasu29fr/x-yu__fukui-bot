name: 商品の成績をつける

# X と yu の投稿キューと計測を突き合わせて、
# どの商品を出した投稿がどれだけ読まれたかを neta/商品.jsonl に書き戻す。
#
# 成績がいい商品は、scripts/商品.py の並びに多く入るので、また出るようになる。
# 生成（毎晩 20:00）より前に走らせたいので、毎日 18:00 JST = 09:00 UTC。
on:
  repository_dispatch:
    types: [product-score]
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "ファイルに書かず、成績だけ表示する"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: product-score
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 成績をつける
        env:
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: |
          set -o pipefail
          node "scripts/商品の成績.mjs" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: コミットする
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          TARGET="neta/商品.jsonl"
          if git diff --quiet -- "${TARGET}"; then
            echo "${TARGET} に変更なし。コミットはしません。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${TARGET}"
          git commit -m "chore(商品): 成績を更新（$(TZ=Asia/Tokyo date +%F)）"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push; then
              exit 0
            fi
            sleep $((2 ** attempt))
          done
          exit 1
