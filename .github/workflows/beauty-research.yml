name: 美容の候補を出す

# 運営事業部・商品リサーチ担当。毎日午前中に、条件に合う商品を5件出す。
# 条件に合う商品を5件出す。投稿はしない。決めるのは代表。
on:
  repository_dispatch:
    types: [beauty-research]
  # GitHub の定時実行は、このアカウントでは**大幅に遅れて**走る（2026-09-26 実測）。
  #   宣言 09:00 UTC（18:00 JST）→ 平均 5.2時間遅れ
  #   宣言 10:15 UTC（19:15 JST）→ 平均 4.9時間遅れ
  #   宣言 10:30 UTC（19:30 JST）→ 平均 4.8時間遅れ
  #   宣言 22:00 UTC（07:00 JST）→ 平均 2.1時間遅れ  ← いちばん軽い
  # 9〜10時台(UTC)は、3リポジトリの日次レビュー・残高チェックと重なって混む。
  # 遅れの少ない夜間(UTC)に移し、19:20 の代表への連絡までに十分な余裕を取る。
  # 1回目が成功していれば2回目は SKIP_IF_FRESH で何もしない。
  schedule:
    - cron: "40 21 * * *"   # 06:40 JST（遅れても午前中には出る）
    - cron: "40 23 * * *"   # 08:40 JST（保険）

permissions:
  contents: write

concurrency:
  group: beauty-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: 楽天から探す
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          RAKUTEN_REFERER: ${{ secrets.RAKUTEN_REFERER }}
          DRY_RUN: ${{ github.event.client_payload.dry_run && '1' || '' }}
          SKIP_IF_FRESH: ${{ github.event_name == 'schedule' && '1' || '' }}
        run: |
          set -o pipefail
          node "scripts/美容を探す.mjs" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: コミットする
        if: ${{ !github.event.client_payload.dry_run }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "neta/美容候補.jsonl" neta/設定.json
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -m "chore(美容): 候補を更新（$(TZ=Asia/Tokyo date +%F)）"
          for i in 1 2 3 4; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push; then exit 0; fi
            sleep $((2 ** i))
          done
          exit 1
